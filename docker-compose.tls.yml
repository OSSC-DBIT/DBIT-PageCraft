# Optional override: expose nginx directly on the public internet with TLS
# (NOT needed when using Cloudflare Tunnel).
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Requires nginx/conf.d/tls.conf (see tls.conf.example) and certificates in nginx/certs/.

services:
  nginx:
    ports:
      - "0.0.0.0:${HTTP_PORT:-80}:80"
      - "0.0.0.0:${HTTPS_PORT:-443}:443"
