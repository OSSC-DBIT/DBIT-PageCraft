name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Syntax check + Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check server and browser scripts
        run: |
          for f in server/*.js public/js/*.js public/sw.js; do
            node --check "$f"
          done

      - name: Build Docker image
        run: docker build -t dbit-pagecraft:ci .

      - name: Validate nginx configuration
        run: |
          docker run --rm \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx/conf.d:/etc/nginx/conf.d:ro" \
            --add-host app:127.0.0.1 \
            nginx:1.27-alpine nginx -t
