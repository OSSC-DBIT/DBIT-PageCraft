name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Syntax check, Docker build, nginx config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check server and browser scripts
        run: |
          for f in server/*.js public/js/*.js public/sw.js; do
            node --check "$f"
          done

      - name: Reject em and en dashes
        run: |
          if grep -rnP '[\x{2013}\x{2014}]' --include='*.html' --include='*.js' --include='*.css' --include='*.md' --include='*.yml' --include='*.conf' --include='*.inc' --include='*.sh' --exclude-dir=node_modules --exclude-dir=.git . ; then
            echo "::error::Em/en dashes found. Use a plain hyphen."; exit 1
          fi

      - name: Build Docker image
        run: docker build -t dbit-pagecraft:ci .

      - name: Validate nginx configuration
        run: |
          docker run --rm \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx/conf.d:/etc/nginx/conf.d:ro" \
            --add-host app:127.0.0.1 \
            nginx:1.27-alpine nginx -t

      - name: Validate compose files
        env:
          POSTGRES_PASSWORD: x
          ADMIN_EMAIL: a@b.c
          ADMIN_PASSWORD: x
          SESSION_SECRET: x
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.tls.yml config -q
