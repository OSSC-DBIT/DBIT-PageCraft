name: CI

on:
  # Every pull request. Pushes to dev and master run this through deploy.yml, which
  # deploys only after it passes, so it is not triggered twice for them.
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Syntax check, Docker build, nginx config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check server, browser and deploy scripts
        run: |
          for f in server/*.js public/js/*.js public/sw.js; do
            node --check "$f"
          done
          for f in deploy/*.sh; do
            bash -n "$f"
          done

      - name: Reject em and en dashes
        run: |
          if grep -rnP '[\x{2013}\x{2014}]' --include='*.html' --include='*.js' --include='*.css' --include='*.md' --include='*.yml' --include='*.conf' --include='*.inc' --include='*.sh' --exclude-dir=node_modules --exclude-dir=.git . ; then
            echo "::error::Em/en dashes found. Use a plain hyphen."; exit 1
          fi

      - name: Build Docker image
        run: docker build -t dbit-pagecraft:ci .

      - name: Validate nginx configuration
        run: |
          docker run --rm \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx/conf.d:/etc/nginx/conf.d:ro" \
            --add-host app:127.0.0.1 \
            nginx:1.27-alpine nginx -t

      - name: Validate compose files
        env:
          POSTGRES_PASSWORD: x
          ADMIN_EMAIL: a@b.c
          ADMIN_PASSWORD: x
          SESSION_SECRET: x
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.tls.yml config -q

      - name: Smoke test the built image
        env:
          POSTGRES_PASSWORD: ci-password
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-password
          SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
          APP_IMAGE: dbit-pagecraft:ci
          APP_VERSION: ci
          HTTP_PORT: 18090
          APP_PORT: 13090
        run: |
          docker compose -p pagecraft-ci up -d --no-build --wait db app nginx
          body="$(curl -fsS http://127.0.0.1:18090/api/health)"
          echo "$body"
          case "$body" in *'"version":"ci"'*) ;; *) echo "::error::health did not report version ci"; exit 1 ;; esac
          curl -fsS -o /dev/null http://127.0.0.1:18090/
          curl -fsS -o /dev/null http://127.0.0.1:18090/project-report
          docker compose -p pagecraft-ci down -v
