name: Deploy

# Continuous deployment to the OSSC server, the same way as PCMS:
#   push to dev     -> CI -> staging     (https://pagecraft-staging.webuildnow.in)
#   push to master  -> CI -> production  (https://pagecraft.webuildnow.in)
# A deploy runs only after CI passes on GitHub-hosted runners. The deploy itself runs on
# the self-hosted runner on the server (label "pagecraft"), which connects out to GitHub,
# so nothing on the server is exposed and no server secret is stored in GitHub.
# See docs/DEPLOYMENT.md.

on:
  push:
    branches: [dev, master]
  # Redeploy by hand (Actions > Deploy > Run workflow). Production only from master.
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy the selected branch
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  target:
    name: Pick the environment
    runs-on: ubuntu-24.04
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
      url: ${{ steps.pick.outputs.url }}
    steps:
      - id: pick
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          WANTED: ${{ inputs.environment }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then env="$WANTED"
          elif [ "$REF" = refs/heads/master ]; then env=production
          elif [ "$REF" = refs/heads/dev ]; then env=staging
          else echo "::error::no environment for $REF"; exit 1; fi
          if [ "$env" = production ] && [ "$REF" != refs/heads/master ]; then
            echo "::error::production deploys only from master (this run is on $REF)"; exit 1
          fi
          case "$env" in
            production) url=https://pagecraft.webuildnow.in ;;
            *)          url=https://pagecraft-staging.webuildnow.in ;;
          esac
          echo "environment=$env" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deploying $REF to $env"

  deploy:
    name: Deploy to ${{ needs.target.outputs.environment }}
    needs: [ci, target]
    # The runner registered on the OSSC server with the label "pagecraft".
    runs-on: [self-hosted, linux, pagecraft]
    timeout-minutes: 30
    # GitHub Environment: deployment history, and "Required reviewers" on Production
    # makes a push to master wait for approval before the runner starts.
    environment:
      name: ${{ needs.target.outputs.environment }}
      url: ${{ needs.target.outputs.url }}
    # One deploy per environment at a time; a deploy in progress is never cancelled
    # halfway, the next one waits.
    concurrency:
      group: deploy-${{ needs.target.outputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Deploy
        run: bash deploy/deploy.sh "${{ needs.target.outputs.environment }}" "$GITHUB_SHA"
