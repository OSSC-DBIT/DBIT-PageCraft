# DBIT PageCraft - nginx main configuration (reverse proxy in front of the app)
# Site definitions live in conf.d/*.conf

user  nginx;
worker_processes  auto;
pid   /var/run/nginx.pid;

error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # The API only accepts small JSON bodies; PDFs are merged in the browser.
    client_max_body_size 1m;

    # -- Real client IP behind Cloudflare Tunnel ------------------------------
    # cloudflared runs inside the Docker network and sets CF-Connecting-IP to
    # the visitor's address. Trust that header only from private (Docker)
    # ranges so $remote_addr, logs and rate limits reflect the real visitor.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   CF-Connecting-IP;

    # Preserve the original scheme reported by Cloudflare (https) when the hop
    # from cloudflared to nginx is plain http.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https   https;
    }

    # Compress text assets served through the proxy.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/xml application/manifest+json image/svg+xml;

    # Extra, coarse rate limit for the API on top of the app's own limiter.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;

    upstream pagecraft_app {
        server app:3000;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
