# DBIT PageCraft - plain HTTP site (port 80)
#
# This is what runs out of the box with `docker compose up`.
# For HTTPS, copy tls.conf.example to tls.conf, put your certificate in
# nginx/certs/, and delete (or rename) this file so port 80 only redirects.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/conf.d/proxy.inc;
}
