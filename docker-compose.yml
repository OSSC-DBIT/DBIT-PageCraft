# DBIT PageCraft - self-hosted stack
#
#   cloudflared (host service, or the optional "tunnel" profile) -> nginx -> app (Node.js) -> db (PostgreSQL)
#
# Local:   cp .env.example .env && docker compose up -d --build
# Server:  deploy/deploy.sh <env> <sha> runs this file with
#          -p <project> --env-file /srv/server-data/<env>/pagecraft/pagecraft.env
#          and APP_IMAGE / APP_VERSION set to pagecraft-app:<env>-<sha>.
# Full guide: docs/DEPLOYMENT.md

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pagecraft}
      POSTGRES_USER: ${POSTGRES_USER:-pagecraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pagecraft} -d ${POSTGRES_DB:-pagecraft}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Uncomment to reach the database from the host (psql, DBeaver, backups):
    # ports:
    #   - "127.0.0.1:${DB_PORT:-5432}:5432"

  app:
    # Built from this directory; deploy.sh tags it pagecraft-app:<env>-<sha> via APP_IMAGE.
    build: .
    image: ${APP_IMAGE:-dbit-pagecraft:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    # Direct access to the Node app from this machine only (bypasses nginx), for debugging.
    ports:
      - "127.0.0.1:${APP_PORT:-3090}:3000"
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-production}
      APP_VERSION: ${APP_VERSION:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-pagecraft}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pagecraft}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # With Cloudflare Tunnel nothing needs to be public: cloudflared talks to
    # http://nginx:80 inside this network. The host binding below is only for
    # local access / debugging and defaults to loopback.
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8090}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Cloudflare Tunnel connector. Enabled with COMPOSE_PROFILES=tunnel in .env.
  # Create the tunnel in Cloudflare Zero Trust, add a public hostname that points
  # to  http://nginx:80  and paste the connector token into CF_TUNNEL_TOKEN.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  pgdata:
  certbot_www:
